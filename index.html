<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DayBox</title>
<meta name="description" content="DayBox: plan, timebox and track your day.">
<meta name="theme-color" content="#0E7C6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DayBox">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface2:#F5F7F6; --ink:#16201C; --muted:#5A6862; --faint:#8A9791;
  --line:#D9E0DC; --line2:#E7ECE9; --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#D8EEE9;
  --warn:#A8670F; --warn-bg:#FBF0DD; --alert:#B83229; --alert-bg:#FBE5E3; --good:#23824F; --good-bg:#DFF2E7;
  --shadow:0 1px 2px rgba(16,32,28,.06),0 6px 20px rgba(16,32,28,.07);
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px; --nav:212px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1210; --surface:#141C19; --surface2:#19231F; --ink:#E3ECE8; --muted:#94A49D; --faint:#6C7C75;
    --line:#26332E; --line2:#1F2A26; --accent:#3CC2A5; --accent-ink:#04201A; --accent-soft:#163A33;
    --warn:#E6A84B; --warn-bg:#352A17; --alert:#F0786E; --alert-bg:#3A1F1C; --good:#5FCB8E; --good-bg:#17332A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#141C19; --surface2:#19231F; --ink:#E3ECE8; --muted:#94A49D; --faint:#6C7C75;
  --line:#26332E; --line2:#1F2A26; --accent:#3CC2A5; --accent-ink:#04201A; --accent-soft:#163A33;
  --warn:#E6A84B; --warn-bg:#352A17; --alert:#F0786E; --alert-bg:#3A1F1C; --good:#5FCB8E; --good-bg:#17332A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:1.25rem} h3{font-size:1.02rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.82rem}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}
#nav{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:600;letter-spacing:-.02em}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;color:var(--muted);font-weight:600}
.nv svg{width:18px;height:18px;flex:none}
.nv:hover{background:var(--surface2);color:var(--ink)}
.nv.on{background:var(--accent-soft);color:var(--accent)}
.nv .badge{margin-left:auto}
#syncBox{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
#syncBox .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
#syncBox .dot.ok{background:var(--good)} #syncBox .dot.err{background:var(--alert)}
main{min-width:0;padding:0 28px 120px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 12px;border-bottom:1px solid var(--line2)}
.top h1{font-size:1.45rem;margin-right:auto}
.top .sub{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:500;margin-left:8px}
.view{padding-top:16px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;padding:0}
.iconbtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.badge{display:inline-flex;align-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--alert);color:#fff;font-size:.72rem;font-weight:700;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:.76rem;font-weight:600;background:var(--surface2);border:1px solid var(--line2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#888);display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:14px}
.card h3{margin-bottom:10px}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.hint{color:var(--muted);font-size:.84rem;margin:4px 0 12px;max-width:68ch}

/* ---------- now bar + alerts ---------- */
.nowbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.nowbar .now-t{font-weight:700;font-size:1.02rem}
.nowbar .now-s{color:var(--muted);font-size:.84rem}
.nowbar .bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:8px}
.nowbar .bar i{display:block;height:100%;background:var(--c,var(--accent))}
.daybar2{margin-top:10px}
.daybar2 .db-t{display:flex;justify-content:space-between;gap:8px;font-size:.74rem;color:var(--muted);font-family:var(--f-mono)}
.nowbar .bar.day{height:8px;margin-top:4px;background:var(--line2)}
.nowbar .bar.day i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--warn)))}
.nowbar .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;font-size:.86rem;background:var(--surface2);border:1px solid var(--line2)}
.al b{font-weight:700}
.al.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.al.alert{background:var(--alert-bg);border-color:transparent;color:var(--alert)}
.al .x{margin-left:auto}
.daybar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.stat{display:flex;flex-direction:column;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:96px}
.stat b{font-family:var(--f-mono);font-size:1.02rem;font-weight:500}
.stat span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat.warn b{color:var(--warn)}
.untracked{padding:12px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- timeline grid ---------- */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;position:relative}
.grid{display:grid;grid-template-columns:52px repeat(var(--cols),minmax(var(--colmin,0px),1fr));min-width:fit-content;position:relative}
.g-ch{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);padding:8px 8px 6px;font-weight:700;font-size:.84rem;cursor:pointer}
.g-ch small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.g-ch.is-today{color:var(--accent)}
.g-corner{position:sticky;top:0;left:0;z-index:7;background:var(--surface);border-bottom:1px solid var(--line)}
.g-times{position:relative;left:0;z-index:5;background:var(--surface)}
.g-times span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:.68rem;color:var(--faint)}
.g-col{position:relative;border-left:1px solid var(--line2);
  background-image:linear-gradient(to bottom,var(--line2) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in srgb,var(--line2) 55%,transparent) 1px,transparent 1px);
  background-size:100% var(--hpx),100% calc(var(--hpx)/2);background-position:0 var(--off),0 var(--off);touch-action:pan-x pan-y}
.g-col.past{background-color:color-mix(in srgb,var(--surface2) 60%,transparent)}
.g-col.virtual .blk{opacity:.82}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--alert);z-index:4;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.gap{position:absolute;left:4px;right:4px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:.74rem;font-weight:600;background:none;z-index:1}
.gap:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.g-ghost{position:absolute;left:3px;right:3px;border-radius:6px;background:var(--accent-soft);border:1.5px dashed var(--accent);z-index:3;pointer-events:none;font-size:.74rem;padding:2px 6px;color:var(--accent);font-family:var(--f-mono)}
.blk{position:absolute;border-radius:6px;padding:3px 7px 3px 8px;overflow:hidden;z-index:2;cursor:grab;user-select:none;-webkit-user-select:none;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink);font-size:.8rem;line-height:1.25;touch-action:pan-x pan-y;transition:box-shadow .15s}
.blk:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.blk.dragging,.blk.lifting{z-index:9;box-shadow:0 8px 22px rgba(0,0,0,.22);cursor:grabbing;opacity:.95}
.blk.locked{cursor:pointer}
.blk .b-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.blk .b-m{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .b-a{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:3px;font-size:.7rem}
.blk .b-a label{display:inline-flex;gap:3px;align-items:center;cursor:pointer}
.blk .b-a input{width:12px;height:12px;margin:0;accent-color:var(--c)}
.blk .b-rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;touch-action:none}
.blk .b-rz::after{content:'';position:absolute;left:50%;bottom:2px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:color-mix(in srgb,var(--c) 55%,transparent);opacity:0;transition:opacity .15s}
.blk:hover .b-rz::after{opacity:1}
.blk .tick{position:absolute;right:0;width:6px;height:0;border-top:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.blk.st-done{background:var(--c);border-color:var(--c);color:#fff}
.blk.st-done .b-m{color:rgba(255,255,255,.85)}
.blk.st-partial{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 38%,var(--surface)) 0 6px,color-mix(in srgb,var(--c) 14%,var(--surface)) 6px 12px)}
.blk.st-skipped{opacity:.5;background:var(--surface2);border-style:dashed}
.blk.st-skipped .b-t{text-decoration:line-through}
.blk.st-moved{opacity:.45;background:none;border-style:dashed}
.blk.needs{box-shadow:inset 0 0 0 2px var(--warn)}
.blk.twice{box-shadow:inset 0 0 0 2px var(--alert)}
.blk .q{margin-left:auto;font-size:.66rem;font-weight:800;color:var(--warn)}
.blk.done-lock{cursor:default}
.blk.done-lock .b-t,.blk.unlocked .b-t{padding-right:20px}
.b-unlock{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:5px;padding:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 35%,transparent);color:inherit;cursor:pointer;z-index:3}
.b-unlock svg{width:12px;height:12px}
.b-unlock.on{background:var(--warn);color:#fff;cursor:default}
@media (max-width:820px){.b-unlock{width:26px;height:26px}.b-unlock svg{width:14px;height:14px}}
.grid.week .blk{font-size:.72rem;padding:2px 5px}
.grid.week .b-a{display:none}
.grid.tpl .g-col{background-color:var(--surface)}
.s-ic{width:12px;height:12px;flex:none}

/* ---------- today: agenda + split ---------- */
.tsplit{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:18px;align-items:start}
.gwrap.daygrid{max-height:calc(100vh - 150px)}
.sumline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;color:var(--muted)}
.sumline .chip b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.warn b{color:var(--warn)}
.warn-t{color:var(--warn)}
.ag{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.ag-h{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2);border:0;border-bottom:1px solid var(--line2);text-align:left}
button.ag-h{cursor:pointer}
.ag-dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.ag-title{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:5px;min-width:0}
.ag-title span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-meta{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-lock{border:0;background:none;padding:4px;color:var(--faint);display:inline-grid;place-items:center;cursor:pointer}
.ag-lock svg{width:15px;height:15px}
.fit-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2)}
.fit-row.sug{grid-template-columns:10px minmax(0,1fr) auto auto}
.fit-row.done .ag-title span{text-decoration:line-through;color:var(--faint)}
.fit-chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--c);background:none;color:#fff;font-weight:800;font-size:.8rem;padding:0;display:grid;place-items:center}
.fit-row.done .fit-chk{background:var(--c)}
.fit-add{display:grid;grid-template-columns:minmax(0,1fr) 82px 104px auto;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.fit-add input,.fit-add select{padding:6px 8px}
.fit-full{padding:10px 12px;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line2)}
.fit-sub{padding:8px 12px 4px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.gap{pointer-events:none}
@media (max-width:820px){.fit-add{grid-template-columns:1fr 1fr auto}.fit-add input{grid-column:1/-1}}
/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
.li .m{color:var(--muted);font-size:.8rem}
.li .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c,var(--accent))}
.dots i.f{background:var(--c,var(--accent))}
.dots i.p{background:color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}

/* ---------- report bits ---------- */
.dir{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.dir .card{padding:14px}
.dir .v{font-family:var(--f-mono);font-size:1.4rem}
.dir .arrow{font-weight:800;font-size:.86rem}
.dir .arrow.good{color:var(--good)} .dir .arrow.bad{color:var(--alert)} .dir .arrow.flat{color:var(--muted)}
.bars{display:flex;gap:4px;align-items:flex-end;height:170px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column-reverse;min-width:6px;height:100%;position:relative}
.bars .col i{display:block;background:var(--c)}
.bars .col i:last-child{border-radius:3px 3px 0 0}
.bars-x{display:flex;gap:4px;margin-top:4px}
.bars-x span{flex:1;text-align:center;font-size:.64rem;color:var(--faint);font-family:var(--f-mono);min-width:6px;overflow:hidden}
.hbar{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;padding:4px 0;font-size:.84rem}
.hbar .track{height:10px;background:var(--line2);border-radius:5px;position:relative;overflow:visible}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.hbar .track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.heat{display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:4px;background:color-mix(in srgb,var(--alert) calc(var(--v)*100%),var(--line2));display:grid;place-items:center;font-size:.6rem;color:var(--ink);font-family:var(--f-mono);max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.find{padding:10px 12px;border-radius:8px;background:var(--surface2);margin:6px 0;font-size:.88rem}
.find.fix{background:var(--good-bg);color:var(--good)}

/* ---------- sheet ---------- */
#ov{position:fixed;inset:0;z-index:50;background:rgba(8,16,13,.42);display:flex;align-items:center;justify-content:center;padding:16px}
#sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:18px 18px 16px}
#sheet .sh-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#sheet .sh-h h2{margin-right:auto}
#sheet .sh-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line2)}
#sheet .sh-f .l{margin-right:auto}
.form{display:flex;flex-direction:column;gap:12px}
.stbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stbtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 4px;font-weight:700;font-size:.82rem}
.stbtns button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sug{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.sug .sw{width:12px;height:36px;border-radius:4px;background:var(--c)}
.sug .t{font-weight:700}
.sug .w{font-size:.78rem;color:var(--muted)}
.sug .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sug.backup{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.closer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.closer .mini{display:inline-flex;gap:4px}
.closer .mini button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:.76rem;font-weight:700}
.closer .mini button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-weight:600;max-width:calc(100% - 32px)}
#toast button{background:none;border:0;color:var(--accent);font-weight:800}
.inbox{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.op{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.op:last-child{border-bottom:0}

#fab{display:none}
#tabbar{display:none}

/* ---------- phone ---------- */
@media (max-width:820px){
  #shell{grid-template-columns:1fr}
  #nav{display:none}
  main{padding:0 14px calc(150px + env(safe-area-inset-bottom))}
  .top{padding:10px 0 8px;gap:8px}
  .top h1{font-size:1.15rem;width:100%}
  .top .tact{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.66rem;font-weight:700;color:var(--muted)}
  #tabbar button svg{width:20px;height:20px}
  #tabbar button.on{color:var(--accent)}
  #fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:41;border:0;border-radius:28px;background:var(--accent);color:var(--accent-ink);padding:12px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);gap:8px;align-items:center}
  #fab svg{width:18px;height:18px}
  .grid2,.grid3,.cols2{grid-template-columns:1fr}
  .dir{grid-template-columns:1fr 1fr}
  .nowbar{grid-template-columns:1fr}
  .nowbar .acts{justify-content:flex-start}
  #ov{align-items:flex-end;padding:0}
  #sheet{border-radius:16px 16px 0 0;max-height:90vh;width:100%;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .hbar{grid-template-columns:84px 1fr 92px}
  .grid.week{--colmin:118px}
  .gwrap.daygrid{max-height:calc(100vh - 270px)}
  .top .tact .seg{margin-right:auto}
  .blk .b-rz{height:14px}

  .heat{grid-template-columns:repeat(9,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#111;font-size:11pt}
  #shell,#tabbar,#fab,#ov,#toast{display:none!important}
  #printArea{display:block}
  .pr h1{font-family:var(--f-display);font-size:20pt;margin:0}
  .pr .ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}
  .pr table{width:100%;border-collapse:collapse}
  .pr td,.pr th{border-bottom:1px solid #999;padding:5px 6px;vertical-align:top;text-align:left;font-size:10pt}
  .pr th{font-size:8pt;letter-spacing:.06em;text-transform:uppercase;border-bottom:1.5px solid #111}
  .pr .tm{font-family:var(--f-mono);white-space:nowrap;width:92px}
  .pr .bx{display:inline-block;width:11px;height:11px;border:1.4px solid #111;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .pr .ln{border-bottom:1px solid #777;height:20px;margin-top:4px}
  .pr .sec{margin-top:14px}
  .pr .sec b{font-size:8.5pt;letter-spacing:.06em;text-transform:uppercase}
  .pr .cat{font-size:8pt;color:#444}
  .pr .att{font-size:9pt;margin-top:2px}
  .pr .blank td{height:24px}
}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  const app = initializeApp({
    apiKey: "AIzaSyA635AeqlLNF5G0YvoUUPEG3cG0AaTVKM4",
    authDomain: "goal-tracker-and-timer.firebaseapp.com",
    projectId: "goal-tracker-and-timer",
    storageBucket: "goal-tracker-and-timer.firebasestorage.app",
    messagingSenderId: "909186538996",
    appId: "1:909186538996:web:3b9359566c7e0b21dd2da1"
  });
  const auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
  let uid = null, unsub = [];
  const ev = (n, d) => document.dispatchEvent(new CustomEvent(n, { detail: d }));
  const need = () => uid ? Promise.resolve() : Promise.reject(new Error('not signed in'));
  // Only planner/{uid}/... is ever written. Tenfold's users/{uid} is read, never written.
  window.DBXFB = {
    get uid() { return uid; },
    signIn: () => signInWithPopup(auth, provider).catch(e => ev('dbx-sync-error', 'Sign-in failed: ' + e.message)),
    signOut: () => signOut(auth),
    pushConfig: c => need().then(() => setDoc(doc(db, 'planner', uid, 'meta', 'config'), c)),
    pushDay: (k, d) => need().then(() => setDoc(doc(db, 'planner', uid, 'days', k), d)),
    pushInbox: o => need().then(() => setDoc(doc(db, 'planner', uid, 'meta', 'inbox'), o)),
    loadInbox: () => need().then(() => getDoc(doc(db, 'planner', uid, 'meta', 'inbox'))).then(s => s.exists() ? s.data() : null),
    pushHistory: (id, o) => need().then(() => setDoc(doc(db, 'planner', uid, 'history', id), o)),
  };
  onAuthStateChanged(auth, async user => {
    uid = user ? user.uid : null;
    if (!user) { unsub.forEach(f => f()); unsub = []; }
    ev('dbx-auth', { signedIn: !!user, email: user ? user.email : null, uid });
    if (!user) return;
    try {
      const [c, ds, ib] = await Promise.all([
        getDoc(doc(db, 'planner', uid, 'meta', 'config')),
        getDocs(collection(db, 'planner', uid, 'days')),
        getDoc(doc(db, 'planner', uid, 'meta', 'inbox')),
      ]);
      const days = {}; ds.forEach(s => { days[s.id] = s.data(); });
      ev('dbx-cloud', { config: c.exists() ? c.data() : null, days, inbox: ib.exists() ? ib.data() : null });
      // live: changes from the phone or from Saarthi show up without a reload
      unsub.forEach(f => f());
      unsub = [
        onSnapshot(doc(db, 'planner', uid, 'meta', 'config'), s => { if (!s.metadata.hasPendingWrites && s.exists()) ev('dbx-cloud', { config: s.data(), live: true }); }),
        onSnapshot(doc(db, 'planner', uid, 'meta', 'inbox'), s => { if (!s.metadata.hasPendingWrites) ev('dbx-inbox', s.exists() ? s.data() : null); }),
        onSnapshot(collection(db, 'planner', uid, 'days'), qs => {
          if (qs.metadata.hasPendingWrites) return;
          const ch = {}; qs.docChanges().forEach(x => { if (x.type !== 'removed') ch[x.doc.id] = x.doc.data(); });
          if (Object.keys(ch).length) ev('dbx-cloud', { days: ch, partial: true, live: true });
        }),
      ];
    } catch (e) { ev('dbx-sync-error', 'Could not load your data: ' + (e.code || e.message) + '. Check the Firestore Rules block for planner.'); }
    try {
      const t = await getDoc(doc(db, 'users', uid));
      if (t.exists()) { const d = t.data(); ev('dbx-tenfold', { goals: d.goals || [], sanyam: d.sanyam || [], sanyamcfg: d.sanyamcfg || {}, src: 'cloud' }); }
    } catch (e) { console.warn('tenfold read', e); }
  });
</script>
